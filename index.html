<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giovanni Tognetto — Partnerships, Marketing &amp; Data</title>
<meta name="description" content="Welcome to my office. Click the things on my desk and shelf to explore my work, what I can do for you, and a little about me.">
<meta property="og:type" content="website">
<meta property="og:title" content="Giovanni Tognetto — Partnerships, Marketing &amp; Data">
<meta property="og:description" content="Freelance partner manager and marketer for events, entertainment and fast-growing brands. Based in Madrid, working across Europe.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#2e2620;--ink:#2e211c;--ink-rgb:46 33 28;--scrim-rgb:30 29 27;
  --paper:#f7f0e2;--light:#f5e9d9;--light-rgb:245 233 217;
  --accent:#f0c64a;--brand:#b2364f;
  --fd:'Playfair Display',Georgia,serif;--fu:'Karla',system-ui,sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--stage);height:100%}
body{font-family:var(--fu);color:var(--light);overflow:hidden}

.page{position:relative;width:100%;height:100dvh;min-height:520px;overflow:hidden}
#scene{position:absolute;inset:0}
#scene canvas{filter:saturate(.93)}
#scene canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:rgb(var(--light-rgb)/.5)}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 46% 40% at 14% 88%,rgb(var(--scrim-rgb)/.55),transparent 100%),
  linear-gradient(0deg,rgb(var(--scrim-rgb)/.8) 0%,rgb(var(--scrim-rgb)/.34) 26%,transparent 48%)}

/* label follows its object, positioned from 3D each frame */
/* a photographed scene falls off at the corners and carries a little grain.
   both are free here: plain CSS over the canvas, no extra render passes. */
.grade{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(118% 88% at 50% 44%, rgba(0,0,0,0) 42%, rgba(0,0,0,.44) 100%)}
.grain{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.055;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  background-size:160px 160px}
@media (prefers-reduced-motion: reduce){ .grain{display:none} }
.chip{position:absolute;z-index:6;transform:translate(-50%,-115%);
  padding:5px 13px;border:1.5px solid var(--ink);border-radius:999px;background:var(--accent);color:var(--ink);
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  opacity:0;transition:opacity .16s;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.chip[data-on=true]{opacity:1}

.brand{position:absolute;top:4%;left:4%;z-index:8;pointer-events:none;
  font-family:var(--fd);font-size:clamp(16px,1.6vw,21px);letter-spacing:.005em;color:var(--light);
  text-shadow:0 2px 14px rgba(0,0,0,.55)}
.actions{position:absolute;top:4%;right:4%;display:flex;gap:8px;z-index:9200;
  transition:opacity .25s, transform .32s cubic-bezier(.3,0,.1,1)}
body[data-panel=open] .actions{transform:translateX(calc(-1 * min(320px,86vw) + 2%))}
body[data-panel=open] #hints{opacity:0;pointer-events:none}
.actions[data-hidden=true]{opacity:0;visibility:hidden}
.pill{min-height:44px;padding:0 16px;border-radius:999px;cursor:pointer;
  border:1px solid rgb(var(--light-rgb)/.28);background:rgb(var(--scrim-rgb)/.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:var(--light);font-family:var(--fu);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.pill:hover{border-color:rgb(var(--light-rgb)/.5)}
.pill[aria-pressed=true],.pill[aria-expanded=true]{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}

.intro{position:absolute;left:4%;bottom:6%;width:40%;min-width:250px;pointer-events:none;z-index:5}
.title{margin:0;font-family:var(--fd);font-weight:400;font-size:clamp(32px,4.4vw,70px);line-height:1.02;letter-spacing:-.015em}
.lede{margin:14px 0 0;max-width:30ch;font-size:clamp(14px,1.1vw,18px);line-height:1.5;color:rgb(var(--light-rgb)/.82)}
.counter{margin-top:20px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgb(var(--light-rgb)/.6)}

.panel{position:fixed;top:0;right:0;z-index:9100;display:flex;flex-direction:column;
  width:min(320px,86vw);height:100dvh;padding:16px 14px;overflow-y:auto;
  background:rgb(var(--scrim-rgb)/.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:-24px 0 60px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .32s cubic-bezier(.3,0,.1,1)}
.panel[data-open=true]{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:10px}
.panel-title{font-family:var(--fd);font-size:18px}
.panel-close{width:44px;height:44px;border-radius:999px;border:1px solid rgb(var(--light-rgb)/.28);background:none;color:var(--light);font-size:18px;cursor:pointer}
.item{display:block;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:10px;background:none;
  color:var(--light);font-family:var(--fu);font-size:15px;text-align:left;cursor:pointer;text-decoration:none}
.item:hover{background:rgb(var(--light-rgb)/.1)}
.group{display:flex;flex-direction:column;gap:1px;margin:4px 0;padding-top:6px;border-top:1px solid rgb(var(--light-rgb)/.14)}
.group-label{padding:4px 12px 2px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--light-rgb)/.55)}
.sub{padding-left:22px;color:rgb(var(--light-rgb)/.85)}

.reader{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;padding:24px}
.reader[data-open=true]{display:flex}
.reader-scrim{position:absolute;inset:0;background:rgba(24,18,15,.7);backdrop-filter:blur(2px)}
.sheet{position:relative;width:min(880px,100%);max-height:84vh;overflow:auto;padding:clamp(26px,4.4vw,52px);
  border-radius:10px;background:var(--paper);color:var(--ink);box-shadow:0 36px 70px rgba(0,0,0,.5)}
/* the sketchfab player lives in its own frame, so it only gets a box, never
   the room: it loads when the panel opens and not before */
.embed3d{position:relative;width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;
  margin:6px 0 8px;background:#241c17;box-shadow:0 14px 36px rgba(0,0,0,.3)}
.embed3d iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
.embed-fallback{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;
  padding:18px;text-align:center;font-size:13px;line-height:1.5;color:#c9bcab}
.r-credit{font-size:12px;line-height:1.5;opacity:.62;margin:0 0 16px}
.r-credit a{color:inherit}
.travel{background:#241c17;border-radius:18px;padding:20px 16px 24px;text-align:center;color:#f3ead9}
.travel canvas{width:min(400px,100%);height:auto;display:block;margin:0 auto 6px;cursor:grab;touch-action:none}
.travel canvas:active{cursor:grabbing}
.travel h3{font-family:var(--fd);font-weight:400;font-size:clamp(25px,3.2vw,36px);margin:2px 0 14px}
.tbar{height:7px;border-radius:99px;background:rgba(255,255,255,.14);max-width:400px;margin:0 auto 9px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tnum{font-size:13.5px;opacity:.85;margin:0 0 14px}
.tchips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:620px;margin:0 auto}
.tchip{border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 12px;font-size:12.5px;opacity:.92}
.tchip.lived{border-color:var(--accent);color:var(--accent)}
.r-img{width:100%;max-width:290px;border-radius:14px;display:block;margin:2px 0 14px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.r-wide{max-width:330px}
.closeX{position:absolute;top:22px;right:22px;z-index:3;width:48px;height:48px;border-radius:999px;border:0;
  background:var(--accent);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.45);transition:transform .15s}
.closeX:hover{transform:scale(1.08)}
.r-name{margin:0 0 4px;font-family:var(--fd);font-weight:400;font-size:clamp(30px,4.2vw,46px);line-height:1.05}
.r-role{margin:0 0 20px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brand)}
.r-rule{height:2px;background:var(--ink);margin-bottom:22px}
.r-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:34px}
.r-lab{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--brand)}
.r-h{margin:0 0 2px;font-family:var(--fd);font-weight:400;font-size:22px}
.r-meta{margin:0 0 8px;font-family:var(--fm);font-size:12px;color:rgb(var(--ink-rgb)/.65)}
.r-p{margin:0 0 16px;font-size:15px;line-height:1.55}
.r-block{margin-bottom:20px}
.r-ul{margin:0 0 16px;padding-left:18px;font-size:14.5px;line-height:1.7}
.sheet a{color:var(--brand)}
.cta{display:inline-block;margin-top:6px;padding:13px 22px;border-radius:999px;background:var(--ink);
  color:var(--paper)!important;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none!important}
.cta:hover{background:var(--brand)}

@media (max-width:899px){
  .intro{width:auto;right:4%;bottom:5%}
  .title{font-size:30px}
  .lede{font-size:14.5px;max-width:none}
  .r-grid{grid-template-columns:1fr;gap:18px}
  .closeX{top:12px;right:12px;width:42px;height:42px}
}
</style>
</head>
<body>

<div class="page">
  <div id="scene"><div class="loading" id="loading">Setting up the office</div></div>
  <div class="scrim"></div>
  <div class="grade" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="chip" id="chip" aria-hidden="true"></div>

  <div class="brand">Giovanni Tognetto</div>

  <div class="actions" id="actions">
    <button class="pill" id="hints" type="button" aria-pressed="false">Hints</button>
    <button class="pill" id="menubtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="panel">Menu</button>
  </div>

  <div class="intro">
    <h1 class="title">Welcome to my office</h1>
    <p class="lede" id="lede">Click around and see what you find — or use the menu for a quicker way through.</p>
    <div class="counter" id="counter">0 of 7 discovered</div>
  </div>
</div>

<nav class="panel" id="panel" aria-label="Quick links" data-open="false">
  <div class="panel-head">
    <span class="panel-title">Quick links</span>
    <button class="panel-close" type="button" aria-label="Close menu" data-close-panel>×</button>
  </div>
  <button class="item" type="button" data-open="about">About me</button>
  <button class="item" type="button" data-open="education">Academic career</button>
  <div class="group">
    <span class="group-label">Work</span>
    <button class="item sub" type="button" data-open="work">Work portfolio</button>
    <button class="item sub" type="button" data-open="services">Services</button>
    <a class="item sub" href="portfolio.html">Full portfolio page</a>
  </div>
  <button class="item" type="button" data-open="resume">Résumé</button>
  <button class="item" type="button" data-open="travel">Where I've been</button>
  <button class="item" type="button" data-open="beyond">Beyond work</button>
  <button class="item" type="button" data-open="contact">Contact</button>
  <button class="item" type="button" data-open="nove">Nove, my work buddy</button>
  <button class="item" type="button" data-open="buddy">My work buddy</button>
  <button class="item" type="button" data-open="calendar">Book a call</button>
  <a class="item" href="https://calendar.app.google/UVRpSX8X4jy7VhyV8" target="_blank" rel="noreferrer">Book a call →</a>
</nav>

<div class="reader" id="reader" data-open="false" role="dialog" aria-modal="true" aria-label="Reader">
  <div class="reader-scrim" data-close-reader></div>
  <button class="closeX" type="button" aria-label="Close" data-close-reader>✕</button>
  <div class="sheet">
    <div id="reader-body"></div>
  </div>
</div>

});

/* ---------- scene ---------- */
const host = document.getElementById('scene');
const scene = new T.Scene();
scene.background = new T.Color('#3b322a');
scene.fog = new T.Fog('#3b322a', 60, 110);

const camera = new T.PerspectiveCamera(30, 1, .1, 200);
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
host.appendChild(renderer.domElement);

/* matte materials: high roughness, no metalness -> no plastic sheen */
/* Flat colour is what makes CG look like plastic: real surfaces have fine
   relief that breaks up the highlight. One shared grain map, used as a bump
   on every material, costs one texture and removes most of that plastic feel. */
function grainTex(px = 512, n = 26000, a = .09){
  const c = document.createElement('canvas'); c.width = c.height = px;
  const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0,0,px,px);
  for (let i=0;i<n;i++){
    const x = Math.random()*px, y = Math.random()*px, r = Math.random()*2.4 + .55;
    g.fillStyle = Math.random() < .5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`;
    g.beginPath(); g.arc(x,y,r,0,6.3); g.fill();
  }
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(3,3);
  return t;
}
/* wood: the desk, floor and chair carry a grain rather than a flat brown */
function woodTex(px = 512){
  const c = document.createElement('canvas'); c.width = c.height = px;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0,0,px,px);
  for (let i=0;i<90;i++){
    const y = Math.random()*px, dark = .06 + Math.random()*.16;
    g.strokeStyle = `rgba(90,55,25,${dark})`;
    g.lineWidth = .5 + Math.random()*2.8;
    g.beginPath();
    for (let x=0;x<=px;x+=6) g.lineTo(x, y + Math.sin(x*.021 + i)*3.2 + Math.sin(x*.006 + i*2)*7);
    g.stroke();
  }
  for (let i=0;i<9000;i++){
    const x = Math.random()*px, y = Math.random()*px;
    g.fillStyle = `rgba(70,42,18,${Math.random()*.07})`;
    g.fillRect(x,y,1.6,1);
  }
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping; t.colorSpace = T.SRGBColorSpace;
  return t;
}
const GRAIN = grainTex(), WOOD = woodTex();
function dialTex(){
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#f2e7d6'; g.beginPath(); g.arc(S/2,S/2,S/2-3,0,6.3); g.fill();
  g.strokeStyle = '#d3c7b0'; g.lineWidth = 7;
  g.beginPath(); g.arc(S/2,S/2,S/2-8,0,6.3); g.stroke();
  const R = S*.33, nums = ['1','2','3','4','5','6','7','8','9','0'];
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i=0;i<10;i++){
    const a = (-112 + i*27) * Math.PI/180;
    const x = S/2 + Math.cos(a)*R, y = S/2 + Math.sin(a)*R;
    g.fillStyle = '#241015'; g.beginPath(); g.arc(x,y,S*.058,0,6.3); g.fill();
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.arc(x,y-S*.006,S*.058,Math.PI,0); g.fill();
    const nx = S/2 + Math.cos(a)*(R + S*.105), ny = S/2 + Math.sin(a)*(R + S*.105);
    g.fillStyle = '#2a1a10'; g.font = '700 ' + Math.round(S*.098) + 'px Helvetica, Arial, sans-serif';
    g.fillText(nums[i], nx, ny);
  }
  g.fillStyle = '#9c8f7a'; g.beginPath(); g.arc(S/2,S/2,S*.12,0,6.3); g.fill();
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function keyboardTex(){
  const W = 940, H = 410, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#8f897d'; g.fillRect(0,0,W,H);
  const rows = [15,15,13,12,9];
  rows.forEach((n,r) => {
    const h = 58, y = 22 + r*74, pad = 10;
    const w = (W - 44 - (n-1)*pad) / n;
    for (let i=0;i<n;i++){
      const x = 22 + i*(w+pad);
      g.fillStyle = '#2f2c28'; g.beginPath(); g.roundRect(x, y, w, h, 9); g.fill();
      g.fillStyle = 'rgba(255,255,255,.07)'; g.beginPath(); g.roundRect(x+2, y+2, w-4, h*.4, 7); g.fill();
    }
  });
  g.fillStyle = '#2f2c28'; g.beginPath(); g.roundRect(240, 22+5*74, 460, 52, 9); g.fill();
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const mat = (c, r = .95) => new T.MeshStandardMaterial({
  color:new T.Color(c), roughness:r, metalness:0, envMapIntensity:.28,
  bumpMap:GRAIN, bumpScale:.016
});
const wood = (c, rep = 2) => {
  const w = WOOD.clone(); w.needsUpdate = true; w.repeat.set(rep,rep);
  return new T.MeshStandardMaterial({color:new T.Color(c), map:w, roughness:.88, metalness:0,
    envMapIntensity:.28, bumpMap:w, bumpScale:.03});
};
const add = (o, parent) => { o.castShadow = true; o.receiveShadow = true; (parent||scene).add(o); return o; };
const place = (m,x,y,z,p) => { m.position.set(x,y,z); return add(m,p); };
const box = (w,h,d,c,x,y,z,p) => {
  /* a small bevel on every edge: the single biggest difference between
     "built in code" and "designed" -- real objects have no razor edges */
  w = Math.abs(w); h = Math.abs(h); d = Math.abs(d);
  const r = Math.min(.085, Math.min(w,h,d) * .4);
  return place(new T.Mesh(new RoundedBoxGeometry(w,h,d,2,r), mat(c)), x,y,z,p);
};
const cyl = (rt,rb,h,c,x,y,z,s=24,p) => place(new T.Mesh(new T.CylinderGeometry(rt,rb,h,s), mat(c)), x,y,z,p);
const sph = (r,c,x,y,z,p) => place(new T.Mesh(new T.SphereGeometry(r,32,24), mat(c)), x,y,z,p);
/* a capsule stretched from point a to point b. rounded ends mean two limbs
   meeting at the same point always look joined, never like two loose sticks. */
const _up = new T.Vector3(0,1,0);
/* One continuous surface swept along a spine curve, its cross-section an oval
   that changes size down the length. A stack of spheres always shows ridges
   where each one ends; this gives a single unbroken silhouette. */
function sweptBody(spine, keys, segs = 90, radial = 22){
  const curve = new T.CatmullRomCurve3(spine.map(q => new T.Vector3(...q)));
  const prof = t => {                                   /* lerp the oval through the keys */
    for (let i=1;i<keys.length;i++){
      if (t <= keys[i][0] || i === keys.length-1){
        const [t0,x0,y0] = keys[i-1], [t1,x1,y1] = keys[i];
        const u = Math.min(1, Math.max(0, (t-t0)/(t1-t0)));
        const e = u*u*(3-2*u);                          /* smoothstep, no kinks */
        return [x0+(x1-x0)*e, y0+(y1-y0)*e];
      }
    }
    return [keys[keys.length-1][1], keys[keys.length-1][2]];
  };
  const pos = [], idx = [];
  const up = new T.Vector3(0,1,0), N = new T.Vector3(), B = new T.Vector3(), Tn = new T.Vector3();
  for (let i=0;i<=segs;i++){
    const t = i/segs;
    const P = curve.getPointAt(t);
    Tn.copy(curve.getTangentAt(t)).normalize();
    B.crossVectors(Tn, up).normalize();                 /* fixed up: no twisting */
    N.crossVectors(B, Tn).normalize();
    const [rx, ry] = prof(t);
    for (let j=0;j<=radial;j++){
      const a = (j/radial)*Math.PI*2;
      const cx = Math.cos(a)*rx, cy = Math.sin(a)*ry;
      pos.push(P.x + B.x*cx + N.x*cy, P.y + B.y*cx + N.y*cy, P.z + B.z*cx + N.z*cy);
    }
  }
  for (let i=0;i<segs;i++) for (let j=0;j<radial;j++){
    const a = i*(radial+1)+j, b = a+radial+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const link = (a, b, r, c, p, m) => {
  const A = new T.Vector3(...a), B = new T.Vector3(...b);
  const d = new T.Vector3().subVectors(B, A), len = d.length();
  const mesh = new T.Mesh(new T.CapsuleGeometry(r, len, 8, 18), m || mat(c));
  mesh.position.copy(A).add(B).multiplyScalar(.5);
  mesh.quaternion.setFromUnitVectors(_up, d.normalize());
  return add(mesh, p);
};

const wall = box(80,34,1,'#55493c',0,12,-5); wall.castShadow = false;

const CONTACT = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(128,128,0,128,128,128);
  rg.addColorStop(0,'rgba(0,0,0,.62)'); rg.addColorStop(.5,'rgba(0,0,0,.28)');
  rg.addColorStop(.8,'rgba(0,0,0,.07)'); rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0,0,256,256);
  return new T.CanvasTexture(c);
})();
const contact = (x,z,w,d,o) => {
  const m = new T.Mesh(new T.PlaneGeometry(w,d),
    new T.MeshBasicMaterial({map:CONTACT, transparent:true, opacity:o, depthWrite:false}));
  m.rotation.x = -Math.PI/2; m.position.set(x, FLOOR + .05, z);
  m.renderOrder = 2; scene.add(m); return m;
};

/* ---- bookcase: three modules of different heights, like a real shelving wall ---- */
const hx = 9.8, bd = 3.6, PT = .42;
const COLS = [
  {x0:-6.6, x1:-2.4, top:12.5, ys:[0, 4.1, 8.2, 12.5]},
  {x0:-2.4, x1: 0.8, top:18.5, ys:[0, 3.4, 6.6, 10.2, 14.4, 18.5]},
  {x0: 0.8, x1: 6.8, top:15.5, ys:[0, 4.4, 8.4, 12.0, 15.5]}
];
const Y = v => FLOOR + v;
const CASE = '#dcb44e', CASE2 = '#c9a033', CASE3 = '#a37f1e';
const edges = {};
COLS.forEach(c => {
  edges[c.x0] = Math.max(edges[c.x0] || 0, c.top);
  edges[c.x1] = Math.max(edges[c.x1] || 0, c.top);
});
Object.keys(edges).forEach(k => box(PT, edges[k], bd, CASE2, hx + parseFloat(k), Y(edges[k]/2), 1.8));
COLS.forEach(c => {
  const w = c.x1 - c.x0, cx = hx + (c.x0 + c.x1)/2;
  /* shelves span the gap BETWEEN dividers and sit a hair shallower, so no two
     surfaces are ever coplanar -- coplanar faces are what made the edges fizz */
  c.ys.forEach(y => box(w - PT + .05, PT, bd - .09, CASE, cx, Y(y), 1.78));
  box(w - PT + .05, c.top, .24, CASE3, cx, Y(c.top/2), .12).castShadow = false;
});
/* a cubby: where its floor is and how wide it runs */
const cub = (ci, i) => {
  const c = COLS[ci];
  return { x: hx + (c.x0 + c.x1)/2, left: hx + c.x0 + PT*.9,
           y: Y(c.ys[i]) + PT/2, w: c.x1 - c.x0 - PT,
           h: (c.ys[i+1] !== undefined ? c.ys[i+1] - c.ys[i] : 3) - PT };
};

function shelfBooks(parent, bx, by, bz, n, s){
  const cl = ['#95473c','#44607a','#bfa055','#5e7556','#9c5433','#6a5c93','#c4bbab'];
  for (let j=0;j<n;j++){
    const h = 1.5 + (j%3)*.36, w = .26 + (j%4)*.08;
    const b = box(w,h,1.6,cl[(j+s)%7], bx + j*.46, by + h/2, bz + ((j*37)%5)*.07, parent);
    if (j%5===4){ b.rotation.z = .22; b.position.y -= .06; }
    b.rotation.y = ((j*37)%7 - 3) * .012;
  }
}

function labelTex(txt){
  const W = 360, H = 110, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#f5f0e4'; g.fillRect(0,0,W,H);
  g.strokeStyle = '#cdc3ae'; g.lineWidth = 5; g.strokeRect(4,4,W-8,H-8);
  g.fillStyle = '#1f2831'; g.font = '700 52px Helvetica, Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(txt, W/2, H/2 + 2);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

/* basketball (clickable -> about).
   two perpendicular great circles -- the equator and one running pole to pole --
   plus a circle centred on each side of the ball, bowing inwards. four seams,
   eight panels, same as a real ball. drawn into the skin so they read as grooves. */
function basketballSkin(){
  const W = 1024, H = 512;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#c4671f'; g.fillRect(0,0,W,H);
  for (let i=0;i<30000;i++){                                   /* pebbling */
    const x = Math.random()*W, y = Math.random()*H, r = Math.random()*1.6 + .45;
    g.fillStyle = Math.random() < .5 ? 'rgba(60,24,0,.10)' : 'rgba(255,206,150,.09)';
    g.beginPath(); g.arc(x,y,r,0,6.3); g.fill();
  }
  /* where a point on the sphere lands on this canvas */
  const uv = (x,y,z) => {
    const th = Math.acos(Math.max(-1,Math.min(1,y)));
    let ph = Math.atan2(z,-x); if (ph < 0) ph += Math.PI*2;
    return [ (ph/(Math.PI*2))*W, (th/Math.PI)*H ];
  };
  /* a circle of angular radius a around axis (cx,cy,cz) */
  const ring = (cx,cy,cz,a) => {
    let up = Math.abs(cy) > .9 ? [1,0,0] : [0,1,0];
    const e1 = [cy*up[2]-cz*up[1], cz*up[0]-cx*up[2], cx*up[1]-cy*up[0]];
    const n1 = Math.hypot(...e1); e1.forEach((v,i)=>e1[i]=v/n1);
    const e2 = [cy*e1[2]-cz*e1[1], cz*e1[0]-cx*e1[2], cx*e1[1]-cy*e1[0]];
    const pts = [];
    for (let i=0;i<=256;i++){
      const t = (i/256)*Math.PI*2, ca = Math.cos(a), sa = Math.sin(a);
      pts.push(uv(ca*cx + sa*(Math.cos(t)*e1[0] + Math.sin(t)*e2[0]),
                  ca*cy + sa*(Math.cos(t)*e1[1] + Math.sin(t)*e2[1]),
                  ca*cz + sa*(Math.cos(t)*e1[2] + Math.sin(t)*e2[2])));
    }
    g.beginPath();
    for (let i=0;i<pts.length;i++){
      const [x,y] = pts[i];
      if (i && Math.abs(x - pts[i-1][0]) > W/2) g.moveTo(x,y);   /* seam wrap */
      else if (i) g.lineTo(x,y);
      else g.moveTo(x,y);
    }
    g.stroke();
  };
  g.strokeStyle = '#1b0e06'; g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 15;
  g.beginPath(); g.moveTo(0,H/2); g.lineTo(W,H/2); g.stroke();   /* equator */
  [W*0.25, W*0.75].forEach(x => {                                /* pole-to-pole circle */
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke();
  });
  ring( 1,0,0, 0.92);                                            /* right-hand circle */
  ring(-1,0,0, 0.92);                                            /* left-hand circle */
  const t = new T.CanvasTexture(c);
  t.colorSpace = T.SRGBColorSpace; t.anisotropy = 4; t.wrapS = T.RepeatWrapping;
  return t;
}

function earthCanvas(){
  if (_earthC) return _earthC;
  const W = 2048, H = 1024;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const oc = g.createLinearGradient(0,0,0,H);
  oc.addColorStop(0,'#1d4e६e'.replace('६','6')); oc.addColorStop(.5,'#27648a'); oc.addColorStop(1,'#1d4e6e');
  g.fillStyle = oc; g.fillRect(0,0,W,H);
  g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 1.2;      /* graticule */
  for (let lon=-180; lon<=180; lon+=30){ const x=(lon+180)/360*W; g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
  for (let lat=-60; lat<=60; lat+=30){ const y=(90-lat)/180*H; g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  g.lineJoin = 'round';
  for (const r of LAND){
    g.beginPath();
    let px = null;
    for (let i=0;i<r.length;i+=2){
      const x = (r[i]+180)/360*W, y = (90-r[i+1])/180*H;
      if (px !== null && Math.abs(x-px) > W/2) g.moveTo(x,y); else if (px !== null) g.lineTo(x,y); else g.moveTo(x,y);
      px = x;
    }
    g.closePath();
    g.fillStyle = '#6f8f55'; g.fill();
    g.strokeStyle = '#59773f'; g.lineWidth = 2; g.stroke();
  }
  for (let i=0;i<40000;i++){                                        /* land/sea mottling */
    const x = Math.random()*W, y = Math.random()*H;
    g.fillStyle = `rgba(0,0,0,${Math.random()*.05})`;
    g.fillRect(x,y,2,2);
  }
  _earthC = c;
  return c;
}

}

}

const TARGETS = [

/* anchor = real top-centre of each object, measured from its geometry,
   so the hover label can never drift away from the thing it names */
const _b3 = new T.Box3();
TARGETS.forEach(t => {
  /* a slightly fattened copy of the very same shape, drawn behind it:
     on hover it reads as an outline that traces the object, not a box.
     cloned before the group is tagged, because the tag refers back to the group */
  t.g.updateWorldMatrix(true, true);
  _b3.setFromObject(t.g);
  t.mats = [];
  t.g.traverse(n => { if (n.isMesh && n.material && n.material.emissive) t.mats.push(n.material); });

  t.g.traverse(n => { n.userData.hit = t; });
  t.g.updateWorldMatrix(true, true);
  _b3.setFromObject(t.anchorOn || t.g);
  t.anchor = new T.Vector3((_b3.min.x+_b3.max.x)/2, _b3.max.y + .2, (_b3.min.z+_b3.max.z)/2);
});

/* ---------- camera framing: fit the whole room ---------- */
const FOCUS = new T.Vector3(-3.0, 4.2, 1.4);
const ROOM_L = -23.0, ROOM_R = 17.0;      /* how far the furniture actually reaches */
let camDist = 60, panX = 0, panMin = 0, panMax = 0, portrait = false, aimY = 2.9;
const SPAN_W = 41.8, SPAN_H = 24.2;
function frameCamera(){
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const vfov = T.MathUtils.degToRad(camera.fov) / 2;
  const dH = (SPAN_H/2) / Math.tan(vfov);
  const dW = (SPAN_W/2) / (Math.tan(vfov) * camera.aspect);
  portrait = camera.aspect < 1.05;
  if (portrait) {
    /* a wide room cannot fit a tall screen without shrinking everything to
       nothing, so show a comfortable slice and let the finger move across it */
    const visW = Math.min(13.5, Math.max(10, SPAN_W * camera.aspect * 1.25));
    camDist = Math.min((visW/2) / (Math.tan(vfov) * camera.aspect), 90);
  } else {
    camDist = Math.min(Math.max(dH, dW) * 1.04, 70);
  }
  const halfW = camDist * Math.tan(vfov) * camera.aspect;
  panMin = Math.min(0, (ROOM_L + halfW) - FOCUS.x);
  panMax = Math.max(0, (ROOM_R - halfW) - FOCUS.x);
  panX = Math.min(panMax, Math.max(panMin, panX));
  aimY = portrait ? 1.5 : FOCUS.y;
  camera.position.set(FOCUS.x + panX, aimY + camDist*0.10, FOCUS.z + camDist);
  camera.lookAt(FOCUS.x + panX, aimY, FOCUS.z);
  camera.updateProjectionMatrix();
  document.body.setAttribute('data-pannable', (panMax - panMin > .5) ? 'true' : 'false');
}
frameCamera();
addEventListener('resize', frameCamera);

/* ---------- hover + click via raycasting (always aligned) ---------- */
const chip = document.getElementById('chip');
const ray = new T.Raycaster();
const ptr = new T.Vector2();
const look = new T.Vector2();      // gentle parallax target
const lookNow = new T.Vector2();
let hovered = null, hintsOn = false, pointerInside = false;
const ptrClient = {x:0, y:0};

function pick(ev){
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left)/r.width)*2 - 1, -((ev.clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(scene.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o) { if (o.userData.hit) return o.userData.hit; o = o.parent; }
  }
  return null;
}
renderer.domElement.addEventListener('pointermove', ev => {
  pointerInside = true;
  ptrClient.x = ev.clientX; ptrClient.y = ev.clientY;
  const r = renderer.domElement.getBoundingClientRect();
  look.set(((ev.clientX - r.left)/r.width)*2 - 1, -((ev.clientY - r.top)/r.height)*2 + 1);
});
renderer.domElement.addEventListener('pointerleave', () => { pointerInside = false; hovered = null; look.set(0,0); renderer.domElement.style.cursor = 'default'; });
/* drag (or swipe) sideways to move across the room */
let dragFrom = null, dragPan = 0, dragged = 0;
const worldPerPx = () => (2 * camDist * Math.tan(T.MathUtils.degToRad(camera.fov)/2) * camera.aspect)
                         / renderer.domElement.getBoundingClientRect().width;
renderer.domElement.addEventListener('pointerdown', ev => {
  if (panMax - panMin < .5) return;
  dragFrom = ev.clientX; dragPan = panX; dragged = 0;
  renderer.domElement.setPointerCapture(ev.pointerId);
});
renderer.domElement.addEventListener('pointermove', ev => {
  if (dragFrom === null) return;
  const dx = ev.clientX - dragFrom;
  dragged = Math.max(dragged, Math.abs(dx));
  panX = Math.min(panMax, Math.max(panMin, dragPan - dx * worldPerPx()));
  if (dragged > 6) renderer.domElement.style.cursor = 'grabbing';
});
const endDrag = ev => {
  if (dragFrom === null) return;
  dragFrom = null;
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'default';
  try { renderer.domElement.releasePointerCapture(ev.pointerId); } catch(e){}
};
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

renderer.domElement.addEventListener('click', ev => {
  if (dragged > 6) { dragged = 0; return; }   /* that was a swipe, not a tap */
  const hit = pick(ev);
  if (hit) openReader(hit.id);
});

/* on touch there is no hover, so a tap shows the label before it opens */
renderer.domElement.addEventListener('pointerdown', ev => {
  if (ev.pointerType !== 'mouse') {
    ptrClient.x = ev.clientX; ptrClient.y = ev.clientY;
    pointerInside = true;
  }
});

/* label follows the object in 3D */
const pos = new T.Vector3();
function placeChip(){
  if (!hovered) { chip.setAttribute('data-on','false'); return; }
  pos.copy(hovered.anchor).project(camera);
  const r = renderer.domElement.getBoundingClientRect();
  chip.style.left = (r.left + (pos.x*.5+.5)*r.width) + 'px';
  chip.style.top  = (r.top + (-pos.y*.5+.5)*r.height) + 'px';
  chip.textContent = hovered.label;
  chip.setAttribute('data-on','true');
}

/* dev hook: only on #dev, used to verify hit-testing after changes */
if (location.hash === '#dev') window.__dev = {
  TARGETS, camera, renderer,
  pickAt(x,y){ const h = pick({clientX:x, clientY:y}); return h ? h.id : null; },
  panRange(){ return [panMin, panMax]; },
  fishAt(){ return FISH.map(f => +f.g.position.x.toFixed(3)); },
  bounds(name){ const o = {laptop, notebook, phone, cup}[name]; if(!o) return null;
    const bb = new T.Box3().setFromObject(o);
    return {minx:+bb.min.x.toFixed(2), maxx:+bb.max.x.toFixed(2), minz:+bb.min.z.toFixed(2), maxz:+bb.max.z.toFixed(2)}; },
  setPan(v){ panX = Math.min(panMax, Math.max(panMin, v)); },
  project(v){ const q = v.clone().project(camera); const r = renderer.domElement.getBoundingClientRect();
    return {x: r.left + (q.x*.5+.5)*r.width, y: r.top + (-q.y*.5+.5)*r.height}; }
};

/* ---------- loop: parallax + hints pulse ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0 = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min((now - t0)/1000, .05); t0 = now;

  if (!reduce) {
    lookNow.x += (look.x - lookNow.x) * Math.min(1, dt*2.6);
    lookNow.y += (look.y - lookNow.y) * Math.min(1, dt*2.6);
    /* kept small on purpose: a bigger sway slides the room out from under the
       cursor, so the thing you are pointing at would change while you aim. */
    const sway = portrait ? 0 : .34;
    camera.position.x = FOCUS.x + panX + lookNow.x * sway;
    camera.position.y = aimY + camDist*0.10 - lookNow.y * (portrait ? 0 : .2);
    camera.lookAt(FOCUS.x + panX, aimY, FOCUS.z);
  }

  /* hovered things warm up; HINTS makes them all breathe */
  const pulse = hintsOn ? (Math.sin(now/320)*.5+.5)*.11 + .04 : 0;
  for (const f of FISH){
    f.g.position.x = f.x + Math.sin(now/1000*f.sp + f.ph) * .42;   /* kept inside the glass */
    f.g.position.y = f.y + Math.sin(now/1400*f.sp + f.ph*1.7) * .12;
    f.g.rotation.y = Math.cos(now/1000*f.sp + f.ph) > 0 ? 0 : Math.PI;
  }
  TARGETS.forEach(t => {
    const lvl = (t === hovered) ? .19 : pulse;
    for (const m of t.mats) m.emissive.setRGB(lvl, lvl*.66, lvl*.2);
  });

  if (pointerInside) {
    const hit = pick({clientX: ptrClient.x, clientY: ptrClient.y});
    if (hit !== hovered) {
      hovered = hit;
      renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
    }
  }
  placeChip();
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
document.getElementById('loading').remove();
if (matchMedia('(hover: none)').matches)
  document.getElementById('lede').textContent =
    'Swipe to look around, tap anything that catches your eye — or use the menu.';

/* ---------- reader, menu, hints, counter ---------- */
const reader = document.getElementById('reader');
const body = document.getElementById('reader-body');
const panel = document.getElementById('panel');
const menubtn = document.getElementById('menubtn');
const hintbtn = document.getElementById('hints');
const actions = document.getElementById('actions');
const counter = document.getElementById('counter');

let found = {};
try { found = JSON.parse(localStorage.getItem('gtFound') || '{}'); } catch(e){}
const tick = () => counter.textContent = Object.keys(found).length + ' of ' + TARGETS.length + ' discovered';
tick();

let lastFocus = null;
/* orthographic globe with a pin per country, drawn from the same coastlines */
let gLon = -25, gLat = 22;
function drawGlobe(cv){
  /* Rendered per pixel by inverting the orthographic projection and sampling the
     equirectangular earth bitmap. Filling only the *visible* points of each
     coastline -- what this used to do -- cuts a straight chord across any shape
     that crosses the horizon, which is what tore the map up when you rotated it. */
  const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  const R = W*.44, cx = W/2, cy = H/2, rad = Math.PI/180;
  const src = earthData(), SW = src.width, SH = src.height, sd = src.data;
  const out = g.createImageData(W, H), od = out.data;
  const s0 = Math.sin(gLat*rad), c0 = Math.cos(gLat*rad);
  const lx = -.40, ly = .44, lz = .80;      /* key light, upper left, towards us */
  for (let py = 0; py < H; py++){
    const ny = (cy - py + .5)/R, ny2 = ny*ny;
    for (let px = 0; px < W; px++){
      const i = (py*W + px) << 2;
      const nx = (px - cx + .5)/R;
      const rho2 = nx*nx + ny2;
      if (rho2 > 1){ od[i+3] = 0; continue; }
      const nz = Math.sqrt(1 - rho2);
      const sinLat = nz*s0 + ny*c0;
      const lat = Math.asin(sinLat > 1 ? 1 : sinLat < -1 ? -1 : sinLat)/rad;
      let lon = gLon + Math.atan2(nx, nz*c0 - ny*s0)/rad;
      lon = ((lon + 180) % 360 + 360) % 360 - 180;
      let u = ((lon + 180)/360*SW) | 0; if (u < 0) u = 0; else if (u >= SW) u = SW - 1;
      let v = ((90 - lat)/180*SH) | 0;  if (v < 0) v = 0; else if (v >= SH) v = SH - 1;
      const si = (v*SW + u) << 2;
      let d = nx*lx + ny*ly + nz*lz;
      let k = .36 + .82*(d > 0 ? d : 0);
      if (rho2 > .80) k *= 1 - (rho2 - .80)/.20*.52;       /* terminator / rim falloff */
      const r = sd[si]*k, gg = sd[si+1]*k, bb = sd[si+2]*k;
      od[i]   = r  > 255 ? 255 : r;
      od[i+1] = gg > 255 ? 255 : gg;
      od[i+2] = bb > 255 ? 255 : bb;
      od[i+3] = 255;
    }
  }
  g.clearRect(0, 0, W, H);
  g.putImageData(out, 0, 0);
  /* a soft specular highlight so it reads as a sphere, not a sticker */
  g.save();
  g.beginPath(); g.arc(cx, cy, R, 0, 6.3); g.clip();
  const hl = g.createRadialGradient(cx - R*.36, cy - R*.40, 0, cx - R*.36, cy - R*.40, R*.95);
  hl.addColorStop(0, 'rgba(255,255,255,.18)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = hl; g.fillRect(cx-R, cy-R, R*2, R*2);
  g.restore();
  /* pins, drawn as vectors on top */
  const proj = (lon, lat) => {
    const la = lat*rad, dl = (lon-gLon)*rad, cl = Math.cos(la);
    const cosc = s0*Math.sin(la) + c0*cl*Math.cos(dl);
    if (cosc < .05) return null;
    return [cx + R*cl*Math.sin(dl), cy - R*(c0*Math.sin(la) - s0*cl*Math.cos(dl)), cosc];
  };
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const [name, lat, lon] of VISITED){
    const q = proj(lon, lat); if (!q) continue;
    const k = 1 + .13*q[2];
    const hX = cx + (q[0]-cx)*k, hY = cy + (q[1]-cy)*k - R*.07;
    g.globalAlpha = Math.min(1, q[2]*4);
    g.strokeStyle = '#efe4cf'; g.lineWidth = Math.max(1.4, R*.008);
    g.beginPath(); g.moveTo(q[0], q[1]); g.lineTo(hX, hY); g.stroke();
    g.beginPath(); g.arc(hX, hY, Math.max(2.4, R*.026), 0, 6.3);
    g.fillStyle = '#e4603a'; g.fill();
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1; g.stroke();
  }
  g.globalAlpha = 1;
}
function initGlobe(){
  const cv = document.getElementById('globeCanvas');
  if (!cv) return;
  drawGlobe(cv);
  let from = null, l0 = 0, t0 = 0;
  cv.addEventListener('pointerdown', e => { from = [e.clientX, e.clientY]; l0 = gLon; t0 = gLat; try { cv.setPointerCapture(e.pointerId); } catch(err){} });
  cv.addEventListener('pointermove', e => {
    if (!from) return;
    gLon = l0 - (e.clientX - from[0]) * .35;
    gLat = Math.max(-80, Math.min(80, t0 + (e.clientY - from[1]) * .35));
    drawGlobe(cv);
  });
  const stop = () => { from = null; };
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
}

function openReader(id){
  if (!CONTENT[id]) return;
  lastFocus = document.activeElement;
  body.innerHTML = CONTENT[id];
  if (id === 'travel') initGlobe();
  reader.setAttribute('data-open','true');
  document.body.style.overflow = 'hidden';
  actions.setAttribute('data-hidden','true');
  chip.setAttribute('data-on','false');
  if (!found[id]) { found[id] = 1; try { localStorage.setItem('gtFound', JSON.stringify(found)); } catch(e){} tick(); }
}
function closeReader(){
  reader.setAttribute('data-open','false');
  document.body.style.overflow = '';
  actions.setAttribute('data-hidden','false');
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
const setPanel = o => {
  panel.setAttribute('data-open', o?'true':'false');
  menubtn.setAttribute('aria-expanded', o?'true':'false');
  document.body.setAttribute('data-panel', o?'open':'closed');
};

document.addEventListener('click', e => {
  const t = e.target.closest('.item[data-open]');
  if (t) { setPanel(false); openReader(t.getAttribute('data-open')); return; }
  if (e.target.closest('[data-close-reader]')) closeReader();
  if (e.target.closest('[data-close-panel]')) setPanel(false);
});
menubtn.addEventListener('click', () => setPanel(panel.getAttribute('data-open') !== 'true'));
hintbtn.addEventListener('click', () => {
  hintsOn = !hintsOn;
  hintbtn.setAttribute('aria-pressed', hintsOn ? 'true' : 'false');
});
addEventListener('keydown', e => {
  if (e.key === 'Escape') { reader.getAttribute('data-open') === 'true' ? closeReader() : setPanel(false); }
});
addEventListener('pointerdown', e => {
  if (panel.getAttribute('data-open') === 'true' && !panel.contains(e.target) && e.target !== menubtn) setPanel(false);
});
