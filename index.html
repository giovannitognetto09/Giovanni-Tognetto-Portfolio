<style>
:root{
  --stage:#2e2620;--ink:#2e211c;--ink-rgb:46 33 28;--scrim-rgb:30 29 27;
  --paper:#f7f0e2;--light:#f5e9d9;--light-rgb:245 233 217;
  --accent:#f0c64a;--brand:#b2364f;
  --fd:'Playfair Display',Georgia,serif;--fu:'Karla',system-ui,sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--stage);height:100%}
body{font-family:var(--fu);color:var(--light);overflow:hidden}

.page{position:relative;width:100%;height:100dvh;min-height:520px;overflow:hidden}
#scene{position:absolute;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:rgb(var(--light-rgb)/.5)}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 46% 40% at 14% 88%,rgb(var(--scrim-rgb)/.55),transparent 100%),
  linear-gradient(0deg,rgb(var(--scrim-rgb)/.8) 0%,rgb(var(--scrim-rgb)/.34) 26%,transparent 48%)}

/* label follows its object, positioned from 3D each frame */
.chip{position:absolute;z-index:6;transform:translate(-50%,-115%);
  padding:5px 13px;border:1.5px solid var(--ink);border-radius:999px;background:var(--accent);color:var(--ink);
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  opacity:0;transition:opacity .16s;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.chip[data-on=true]{opacity:1}

.actions{position:absolute;top:4%;right:4%;display:flex;gap:8px;z-index:9200;
  transition:opacity .25s, transform .32s cubic-bezier(.3,0,.1,1)}
body[data-panel=open] .actions{transform:translateX(calc(-1 * min(320px,86vw) + 2%))}
body[data-panel=open] #hints{opacity:0;pointer-events:none}
.actions[data-hidden=true]{opacity:0;visibility:hidden}
.pill{min-height:44px;padding:0 16px;border-radius:999px;cursor:pointer;
  border:1px solid rgb(var(--light-rgb)/.28);background:rgb(var(--scrim-rgb)/.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:var(--light);font-family:var(--fu);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.pill:hover{border-color:rgb(var(--light-rgb)/.5)}
.pill[aria-pressed=true],.pill[aria-expanded=true]{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}

.intro{position:absolute;left:4%;bottom:6%;width:40%;min-width:250px;pointer-events:none;z-index:5}
.title{margin:0;font-family:var(--fd);font-weight:400;font-size:clamp(32px,4.4vw,70px);line-height:1.02;letter-spacing:-.015em}
.lede{margin:14px 0 0;max-width:30ch;font-size:clamp(14px,1.1vw,18px);line-height:1.5;color:rgb(var(--light-rgb)/.82)}
.counter{margin-top:20px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgb(var(--light-rgb)/.6)}

.panel{position:fixed;top:0;right:0;z-index:9100;display:flex;flex-direction:column;
  width:min(320px,86vw);height:100dvh;padding:16px 14px;overflow-y:auto;
  background:rgb(var(--scrim-rgb)/.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:-24px 0 60px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .32s cubic-bezier(.3,0,.1,1)}
.panel[data-open=true]{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:10px}
.panel-title{font-family:var(--fd);font-size:18px}
.panel-close{width:44px;height:44px;border-radius:999px;border:1px solid rgb(var(--light-rgb)/.28);background:none;color:var(--light);font-size:18px;cursor:pointer}
.item{display:block;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:10px;background:none;
  color:var(--light);font-family:var(--fu);font-size:15px;text-align:left;cursor:pointer;text-decoration:none}
.item:hover{background:rgb(var(--light-rgb)/.1)}
.group{display:flex;flex-direction:column;gap:1px;margin:4px 0;padding-top:6px;border-top:1px solid rgb(var(--light-rgb)/.14)}
.group-label{padding:4px 12px 2px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--light-rgb)/.55)}
.sub{padding-left:22px;color:rgb(var(--light-rgb)/.85)}

.reader{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;padding:24px}
.reader[data-open=true]{display:flex}
.reader-scrim{position:absolute;inset:0;background:rgba(24,18,15,.7);backdrop-filter:blur(2px)}
.sheet{position:relative;width:min(880px,100%);max-height:84vh;overflow:auto;padding:clamp(26px,4.4vw,52px);
  border-radius:10px;background:var(--paper);color:var(--ink);box-shadow:0 36px 70px rgba(0,0,0,.5)}
.closeX{position:absolute;top:22px;right:22px;z-index:3;width:48px;height:48px;border-radius:999px;border:0;
  background:var(--accent);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.45);transition:transform .15s}
.closeX:hover{transform:scale(1.08)}
.r-name{margin:0 0 4px;font-family:var(--fd);font-weight:400;font-size:clamp(30px,4.2vw,46px);line-height:1.05}
.r-role{margin:0 0 20px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brand)}
.r-rule{height:2px;background:var(--ink);margin-bottom:22px}
.r-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:34px}
.r-lab{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--brand)}
.r-h{margin:0 0 2px;font-family:var(--fd);font-weight:400;font-size:22px}
.r-meta{margin:0 0 8px;font-family:var(--fm);font-size:12px;color:rgb(var(--ink-rgb)/.65)}
.r-p{margin:0 0 16px;font-size:15px;line-height:1.55}
.r-block{margin-bottom:20px}
.r-ul{margin:0 0 16px;padding-left:18px;font-size:14.5px;line-height:1.7}
.sheet a{color:var(--brand)}
.cta{display:inline-block;margin-top:6px;padding:13px 22px;border-radius:999px;background:var(--ink);
  color:var(--paper)!important;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none!important}
.cta:hover{background:var(--brand)}

@media (max-width:899px){
  .intro{width:auto;right:4%;bottom:5%}
  .title{font-size:30px}
  .lede{font-size:14.5px;max-width:none}
  .r-grid{grid-template-columns:1fr;gap:18px}
  .closeX{top:12px;right:12px;width:42px;height:42px}
}
</style>
</head>

<script type="module">
import * as T from 'three';

/* ---------- content for the reader ---------- */
const CAL = 'https://calendar.app.google/UVRpSX8X4jy7VhyV8';
const MAIL = 'giovannitognetto.uni@gmail.com';
const LI = 'https://www.linkedin.com/in/giovannitognetto';
const head = (n,r) => `<h2 class="r-name">${n}</h2><p class="r-role">${r}</p><div class="r-rule"></div>`;
const cta = (h,t,b) => `<a class="cta" href="${h}"${b?' target="_blank" rel="noreferrer"':''}>${t}</a>`;

const CONTENT = {
  work: head('Selected work','Partnerships · Events · Data') + `<div class="r-grid"><div>
    <div class="r-block"><h3 class="r-h">30+ live events across Europe</h3><p class="r-meta">Fever · Madrid · 2024–present</p><p class="r-p">Managed the end-to-end lifecycle of live events, from post-contract handoff to final closing, coordinating 5+ internal teams and launching concerts and sport events. Main point of contact for 15+ key partners.</p></div>
    <div class="r-block"><h3 class="r-h">A national festival, 12 cities</h3><p class="r-meta">RDS · Italy · 2023</p><p class="r-p">Managed the RDS Summer Festival across 12 locations with 150,000+ attendees, 40+ marketing activations and 50+ sponsor and stakeholder relationships, including media plans and budgets.</p></div>
    <div class="r-block"><h3 class="r-h">Finding the next big partners</h3><p class="r-meta">Fever · Madrid · 2024–2025</p><p class="r-p">Analyzed 500+ opportunities across 10+ countries, managed a 500+ account CRM and supported the negotiation of 50+ new partnerships with producers and venues.</p></div>
    </div><div><p class="r-lab">In numbers</p><ul class="r-ul"><li>30+ live events</li><li>15+ key partners</li><li>500+ opportunities analyzed</li><li>150K+ festival attendees</li><li>10+ countries</li></ul>${cta('/portfolio.html','Full portfolio')}</div></div>`,

  services: head('What I can do for you','Freelance services') + `<div class="r-grid"><div>
    <div class="r-block"><h3 class="r-h">Partnership management</h3><p class="r-p">Find, onboard and grow partners. I run the whole relationship, from the signed contract to the final closing.</p></div>
    <div class="r-block"><h3 class="r-h">Marketing &amp; campaigns</h3><p class="r-p">Plan and launch campaigns and brand activations with clear, measurable results.</p></div>
    <div class="r-block"><h3 class="r-h">Data &amp; market research</h3><p class="r-p">Market scans, CRM clean-up, performance analysis and opportunity sizing, so decisions rest on data.</p></div>
    <div class="r-block"><h3 class="r-h">Event execution</h3><p class="r-p">End-to-end delivery of live events, from planning and coordination to on-site execution and closing.</p></div>
    </div><div><p class="r-lab">Good fit for</p><ul class="r-ul"><li>Events &amp; entertainment companies</li><li>Startups and scaleups</li><li>Small businesses</li></ul>${cta(CAL,'Book a free call',1)}</div></div>`,

  about: head('Hi, I’m Giovanni','Italian in Madrid') + `<div class="r-grid"><div>
    <p class="r-p">I am a partner manager and marketer living in Madrid. I work with events, entertainment and fast-growing brands, turning partnerships into things that actually happen: campaigns that launch, events that run, numbers that add up.</p>
    <p class="r-p">I studied at Bocconi, UPF Barcelona and IE Business School, where I was picked as top student for the Global Immersion Week in Amsterdam. Along the way I have worked at Fever, RDS and illycaffè.</p>
    <p class="r-p">What I like is the mix of commercial instinct and data: finding the opportunity, then proving it worked.</p>
    </div><div><p class="r-lab">Based in</p><p class="r-p">Madrid, Spain · EU citizen</p><p class="r-lab">Works across</p><p class="r-p">Europe, remote and on-site</p>${cta(CAL,'Say hello',1)}</div></div>`,

  resume: head('Giovanni Tognetto','Partnerships · Marketing · Data') + `<div class="r-grid"><div><p class="r-lab">Experience</p>
    <div class="r-block"><h3 class="r-h">Fever</h3><p class="r-meta">Partner Management Associate · Aug 2025 — present</p><p class="r-p">30+ live events end to end, 15+ key partners, 10+ marketing campaigns, 5+ new partner acquisitions.</p><p class="r-meta">Market Research Analyst · Sep 2024 — Aug 2025</p><p class="r-p">500+ opportunities analyzed, 500+ account CRM, 50+ partnerships negotiated.</p></div>
    <div class="r-block"><h3 class="r-h">RDS — Radio Dimensione Suono</h3><p class="r-meta">Special Initiatives, Marketing Intern · Jan — Jul 2023</p><p class="r-p">RDS Summer Festival in 12 cities, 150,000+ attendees, 40+ activations, 50+ sponsors.</p></div>
    <div class="r-block"><h3 class="r-h">illycaffè</h3><p class="r-meta">Project Management Intern · Mar — May 2021</p><p class="r-p">8+ benchmark analyses, 5% less packaging waste, 7% revenue increase.</p></div>
    </div><div><p class="r-lab">Education</p>
    <p class="r-p"><strong>IE Business School</strong><br>Master’s in Digital Marketing &amp; Analytics (2023–2024) · Top Student</p>
    <p class="r-p"><strong>UPF Barcelona School of Management</strong><br>Master’s in Marketing (2021–2022) · Class Representative</p>
    <p class="r-p"><strong>Università Bocconi</strong><br>BSc Business Administration (2018–2021)</p>
    <p class="r-lab">Tools</p><p class="r-p">Salesforce · Google Analytics · Google Ads · SQL · Python · Tableau · Excel</p>${cta(CAL,'Book a free call',1)}</div></div>`,

  languages: head('Languages','Four, and counting') + `<div class="r-grid"><div>
    <p class="r-p">I work in three languages every week, which helps when a partner in Milan, a venue in Madrid and a client in London all need an answer the same afternoon.</p>
    <ul class="r-ul"><li><strong>Italian</strong> — native</li><li><strong>English</strong> — native</li><li><strong>Spanish</strong> — fluent</li><li><strong>French</strong> — beginner</li></ul>
    </div><div><p class="r-lab">Works across</p><p class="r-p">Italy, Spain, the UK and the rest of Europe, remote or on-site.</p>${cta(CAL,'Say hello',1)}</div></div>`,

  beyond: head('Beyond work','The other half') + `<div class="r-grid"><div>
    <p class="r-p">Fifteen years of basketball at national level, which is where I learned most of what I know about teams, pressure and showing up when it is not fun.</p>
    <p class="r-p">Formula 1 on Sundays, music most other days, and travelling whenever the calendar allows it.</p>
    </div><div><p class="r-lab">Ask me about</p><ul class="r-ul"><li>Basketball</li><li>Formula 1</li><li>Live music</li><li>Where to eat in Madrid</li></ul></div></div>`,

  contact: head('Let’s build something','Contact') + `<div class="r-grid"><div>
    <p class="r-p">Tell me about your project, your goals and your timeline, and I’ll get back to you. Prefer to talk it through? Grab a free 30-minute slot in my calendar.</p>${cta(CAL,'Book a free call',1)}
    </div><div><p class="r-lab">Direct</p><p class="r-p"><a href="mailto:${MAIL}">${MAIL}</a><br><a href="${LI}" target="_blank" rel="noreferrer">LinkedIn</a></p><p class="r-lab">Based in</p><p class="r-p">Madrid, Spain</p></div></div>`
};

/* ---------- scene ---------- */
const host = document.getElementById('scene');
const scene = new T.Scene();
scene.background = new T.Color('#3b322a');
scene.fog = new T.Fog('#3b322a', 60, 110);

const camera = new T.PerspectiveCamera(30, 1, .1, 200);
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
host.appendChild(renderer.domElement);

/* matte materials: high roughness, no metalness -> no plastic sheen */
const mat = (c, r = .95) => new T.MeshStandardMaterial({color:new T.Color(c), roughness:r, metalness:0});
const add = (o, parent) => { o.castShadow = true; o.receiveShadow = true; (parent||scene).add(o); return o; };
const place = (m,x,y,z,p) => { m.position.set(x,y,z); return add(m,p); };
const box = (w,h,d,c,x,y,z,p) => place(new T.Mesh(new T.BoxGeometry(w,h,d), mat(c)), x,y,z,p);
const cyl = (rt,rb,h,c,x,y,z,s=24,p) => place(new T.Mesh(new T.CylinderGeometry(rt,rb,h,s), mat(c)), x,y,z,p);
const sph = (r,c,x,y,z,p) => place(new T.Mesh(new T.SphereGeometry(r,32,24), mat(c)), x,y,z,p);

/* room */
const FLOOR = -5.2;
const wall = box(80,34,1,'#55493c',0,12,-5); wall.castShadow = false;
const floor = box(80,1,26,'#3a3029',0,FLOOR-.5,7); floor.castShadow = false;
const rug = cyl(7.4,7.4,.12,'#7a4f45',-5.6,FLOOR+.06,4.2,44); rug.castShadow = false;
rug.scale.set(1,1,.72);

/* light */
scene.add(new T.HemisphereLight(0xfff0dc, 0x5a4a38, 1.25));
scene.add(new T.AmbientLight(0xffe9d0, .22));
const key = new T.DirectionalLight(0xffe8c8, 1.85);
key.position.set(-9,21,27); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.bias = -.0012; key.shadow.radius = 5;
Object.assign(key.shadow.camera,{left:-28,right:28,top:24,bottom:-18,near:1,far:70});
scene.add(key);
const fill = new T.DirectionalLight(0xd8c0a0, .7); fill.position.set(16,8,14); scene.add(fill);
const warmL = new T.PointLight(0xffd49a, 90, 34, 2); warmL.position.set(-8,6,7); scene.add(warmL);
const warmR = new T.PointLight(0xffd9a8, 70, 30, 2); warmR.position.set(9,6,8); scene.add(warmR);

/* ---- desk ---- */
const deskTop = .5, dx = -6.8;
box(14,.55,5.8,'#7a512f',dx,deskTop,1.4);
box(13,.6,.7,'#5d3c21',dx,deskTop-.7,-1.1);
[[-6.4,3.6],[6.4,3.6],[-6.4,-.6],[6.4,-.6]].forEach(([ox,oz]) =>
  box(.62,FLOOR-deskTop+.3,.62,'#5a3a20',dx+ox,(FLOOR+deskTop)/2,oz));
box(12,.35,3.4,'#5d3c21',dx,FLOOR+2.1,1.4);

/* chair back, behind the desk */
const chair = box(4.6,3.4,.5,'#4a3b2d',dx+.4,FLOOR+4.4,5.9); chair.rotation.x = .08;

/* laptop (clickable -> work) */
const laptop = new T.Group(); scene.add(laptop);
box(5.6,.3,3.6,'#bdb6a7',0,0,0,laptop);
box(4.6,.03,2.1,'#908a7d',0,.17,.5,laptop);
box(3.2,.05,.5,'#a8a193',0,.17,-1.1,laptop);
const lid = new T.Group(); laptop.add(lid);
box(5.6,3.4,.24,'#332e27',0,1.7,0,lid);
box(5.05,2.9,.06,'#15120e',0,1.72,.15,lid);
[['#c74a38',.6,-1.7],['#e8c35a',1.15,-.8],['#5fa87d',1.75,.1],['#8a78e0',2.4,1],['#d98a3a',1.3,1.85]]
  .forEach(([c,h,x]) => box(.5,h,.04,c,x,.72+h/2,.19,lid));
lid.position.set(0,.14,-1.72); lid.rotation.x = -.2;
laptop.position.set(dx-1.6, deskTop+.42, 1.2);
laptop.rotation.y = .09;

/* notebook (clickable -> services) */
const notebook = new T.Group(); scene.add(notebook);
box(3.9,.45,2.9,'#e8bf49',0,0,0,notebook);
box(3.5,.08,2.5,'#f7f0e2',0,.26,0,notebook);
for (let i=0;i<5;i++) box(2.6,.04,.1,'#4a4136',.06,.31,-.85+i*.42,notebook);
cyl(.09,.09,2.8,'#2a241c',-1.5,.42,0,10,notebook).rotation.z = Math.PI/2;
notebook.position.set(dx+4.3, deskTop+.5, 2.5);
notebook.rotation.y = -.26; notebook.rotation.x = -.1;

/* phone on a stand (clickable -> contact) */
const phone = new T.Group(); scene.add(phone);
box(1.5,.22,1.1,'#2f2822',0,.11,.26,phone);
const slab = new T.Group(); phone.add(slab);
box(1.2,2.5,.2,'#1d1b19',0,1.25,0,slab);
box(1.04,2.18,.06,'#123532',0,1.28,.12,slab);
box(.36,.08,.05,'#3b3b39',0,2.3,.14,slab);
sph(.1,'#6fe0ae',0,.5,.14,slab);
slab.position.set(0,.18,-.16); slab.rotation.x = -.2;
phone.position.set(dx+6.6, deskTop+.28, 1.5); phone.rotation.y = -.34;

/* mug + papers */
const mug = cyl(.46,.4,1,'#efe7d6',dx-5,deskTop+.78,2.9);
const hdl = add(new T.Mesh(new T.TorusGeometry(.3,.08,8,18), mat('#efe7d6')));
hdl.position.set(dx-4.52,deskTop+.8,2.9); hdl.rotation.y = Math.PI/2;
box(2.1,.07,1.5,'#f2ead9',dx-4.3,deskTop+.31,-.3).rotation.y = .3;

/* ---- bookcase ---- */
const hx = 8.6, bw = 11.4, bd = 3.6;
const shelfYs = [FLOOR+.4, FLOOR+3.9, FLOOR+7.4, FLOOR+10.9, FLOOR+14.2];
shelfYs.forEach((y,i) => box(bw,.5,bd,i?'#e3b93f':'#c99a1d',hx,y,1.8));
const bcMidY = (shelfYs[0]+shelfYs[4])/2, bcH = shelfYs[4]-shelfYs[0];
box(.5,bcH,bd,'#d5ad33',hx-5.45,bcMidY,1.8);
box(.5,bcH,bd,'#d5ad33',hx+5.45,bcMidY,1.8);
box(.45,bcH,bd,'#dab534',hx,bcMidY,1.8);
box(bw,bcH,.3,'#a07c17',hx,bcMidY,.2).castShadow = false;

function shelfBooks(parent, bx, by, bz, n, s){
  const cl = ['#9c4338','#3e5e7e','#c9a64a','#5e7a4f','#a6512e','#6b5aa6','#cfc5b1'];
  for (let j=0;j<n;j++){
    const h = 1.6+(j%3)*.38, w = .26+(j%4)*.08;
    const b = box(w,h,1.6,cl[(j+s)%7], bx+j*.46, by+h/2, bz, parent);
    if (j%5===4){ b.rotation.z = .22; b.position.y -= .06; }
  }
}
/* top shelf books (clickable -> resume) */
const bookGroup = new T.Group(); scene.add(bookGroup);
shelfBooks(bookGroup, hx-5, shelfYs[3]+.25, 2, 8, 0);
shelfBooks(bookGroup, hx+.7, shelfYs[3]+.25, 2, 6, 3);
/* decorative books */
shelfBooks(null, hx-5, shelfYs[2]+.25, 2, 6, 2);
shelfBooks(null, hx+.7, shelfYs[0]+.25, 2, 7, 5);
shelfBooks(null, hx-5, shelfYs[1]+.25, 2, 5, 1);

/* basketball (clickable -> about) */
const ball = new T.Group(); scene.add(ball);
sph(1.15,'#c26f2a',0,0,0,ball);
const seamGeo = new T.TorusGeometry(1.15,.05,8,44);
[0, Math.PI/2].forEach(r => { const s = add(new T.Mesh(seamGeo, mat('#3a2a1c')), ball); s.rotation.y = r; });
add(new T.Mesh(seamGeo, mat('#3a2a1c')), ball).rotation.x = Math.PI/2;
ball.position.set(hx-2.6, shelfYs[0]+1.4, 2);

/* globe (clickable -> languages) */
const globe = new T.Group(); scene.add(globe);
const gball = sph(1.05,'#35738c',0,1.15,0,globe);
[[.42,.5,.9,.5],[.3,-.45,.75,.4],[.36,.1,1.35,.3]].forEach(([r,ax,ay,az]) => {
  const c = add(new T.Mesh(new T.SphereGeometry(r,12,10), mat('#86a86a')), globe);
  c.scale.set(1,.55,.5); c.position.set(ax*.72, 1.15+ay*.55, az*.62);
});
cyl(.1,.1,2.3,'#4a4136',0,1.1,0,10,globe).rotation.z = .3;
cyl(.55,.68,.3,'#4a4136',0,0,0,24,globe);
globe.position.set(hx+2.8, shelfYs[1]+.25, 2);

/* plant in a cubby (clickable -> beyond) */
const plant = new T.Group(); scene.add(plant);
cyl(.72,.52,1.1,'#a9603f',0,.55,0,24,plant);
cyl(.78,.78,.18,'#bb6e49',0,1.1,0,24,plant);
for (let i=0;i<7;i++){
  const a = (i/7)*Math.PI*2 + .4, L = 1.5+(i%3)*.55, lean = .3+(i%2)*.14;
  const st = add(new T.Mesh(new T.CylinderGeometry(.055,.075,L,6), mat('#4e7f3c')), plant);
  st.position.set(Math.cos(a)*.3, 1.1+L/2, Math.sin(a)*.26);
  st.rotation.z = -Math.cos(a)*lean; st.rotation.x = Math.sin(a)*lean;
  const lf = add(new T.Mesh(new T.SphereGeometry(.34,12,10), mat(i%2?'#6aa84f':'#7cb860')), plant);
  lf.scale.set(1,.34,.72);
  lf.position.set(Math.cos(a)*(.3+L*lean*.52), 1.1+L*.99, Math.sin(a)*(.26+L*lean*.46));
  lf.rotation.y = -a; lf.rotation.z = -Math.cos(a)*lean;
}
plant.position.set(hx+2.7, shelfYs[2]+.25, 2);

/* ---- floating wall shelf with frames (decor) ---- */
const shY = 8.2, sx = -9.4, sz = -3.5;
box(8.2,.42,1.8,'#e3b93f',sx,shY,sz);
box(.5,.5,1.4,'#c99a1d',sx-3.4,shY-.45,sz);
box(.5,.5,1.4,'#c99a1d',sx+3.4,shY-.45,sz);
const picture = (x,y,w,h,c) => {
  box(w,h,.2,'#e8e0cf',x,y,sz);
  box(w-.55,h-.55,.07,c,x,y,sz+.14);
  box(w*.5,.14,.5,'#cdbfa6',x,y-h/2+.1,sz+.4);
};
picture(sx-1.5, shY+1.5, 2.1, 2.3, '#8c7b64');
picture(sx+1.1, shY+1.35, 1.8, 2, '#5c6b7a');
cyl(.3,.42,.8,'#9c6b4a',sx+3, shY+.6,sz+.1);

/* wall clock (decor, fills the empty wall) */
const clock = new T.Group(); scene.add(clock);
const face = cyl(1.5,1.5,.3,'#efe7d6',0,0,0,36,clock); face.rotation.x = Math.PI/2;
const rim = add(new T.Mesh(new T.TorusGeometry(1.5,.16,10,36), mat('#4a3b2d')), clock);
box(.12,1,.08,'#3a322a',0,.3,.2,clock);
box(.1,.7,.08,'#8a3b32',.22,.1,.2,clock).rotation.z = -1.1;
clock.position.set(.6, 9.4, -4.2);

/* ---------- clickable objects ---------- */
const TARGETS = [
  {g: laptop,   id:'work',      label:'Selected work'},
  {g: notebook, id:'services',  label:'Services'},
  {g: phone,    id:'contact',   label:'Say hello'},
  {g: ball,     id:'about',     label:'About me'},
  {g: bookGroup,id:'resume',    label:'R\u00e9sum\u00e9'},
  {g: globe,    id:'languages', label:'Languages'},
  {g: plant,    id:'beyond',    label:'Beyond work'}
];
/* anchor = real top-centre of each object, measured from its geometry,
   so the hover label can never drift away from the thing it names */
const _b3 = new T.Box3();
TARGETS.forEach(t => {
  t.g.traverse(o => { o.userData.hit = t; });
  t.g.updateWorldMatrix(true, true);
  _b3.setFromObject(t.g);
  t.anchor = new T.Vector3((_b3.min.x+_b3.max.x)/2, _b3.max.y + .2, (_b3.min.z+_b3.max.z)/2);
});

/* ---------- camera framing: fit the whole room ---------- */
const FOCUS = new T.Vector3(.4, 2.9, 1.4);
const ROOM_L = -13.6, ROOM_R = 14.4;      /* how far the furniture actually reaches */
let camDist = 60, panX = 0, panMin = 0, panMax = 0, portrait = false, aimY = 2.9;
const SPAN_W = 32.5, SPAN_H = 19.5;
function frameCamera(){
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const vfov = T.MathUtils.degToRad(camera.fov) / 2;
  const dH = (SPAN_H/2) / Math.tan(vfov);
  const dW = (SPAN_W/2) / (Math.tan(vfov) * camera.aspect);
  portrait = camera.aspect < 1.05;
  if (portrait) {
    /* a wide room cannot fit a tall screen without shrinking everything to
       nothing, so show a comfortable slice and let the finger move across it */
    const visW = Math.min(16, Math.max(11, SPAN_W * camera.aspect * 1.25));
    camDist = Math.min((visW/2) / (Math.tan(vfov) * camera.aspect), 90);
  } else {
    camDist = Math.min(Math.max(dH, dW) * 1.04, 70);
  }
  const halfW = camDist * Math.tan(vfov) * camera.aspect;
  panMin = Math.min(0, (ROOM_L + halfW) - FOCUS.x);
  panMax = Math.max(0, (ROOM_R - halfW) - FOCUS.x);
  panX = Math.min(panMax, Math.max(panMin, panX));
  aimY = portrait ? 1.5 : FOCUS.y;
  camera.position.set(FOCUS.x + panX, aimY + camDist*0.10, FOCUS.z + camDist);
  camera.lookAt(FOCUS.x + panX, aimY, FOCUS.z);
  camera.updateProjectionMatrix();
  document.body.setAttribute('data-pannable', (panMax - panMin > .5) ? 'true' : 'false');
}
frameCamera();
addEventListener('resize', frameCamera);

/* ---------- hover + click via raycasting (always aligned) ---------- */
const chip = document.getElementById('chip');
const ray = new T.Raycaster();
const ptr = new T.Vector2();
const look = new T.Vector2();      // gentle parallax target
const lookNow = new T.Vector2();
let hovered = null, hintsOn = false, pointerInside = false;
const ptrClient = {x:0, y:0};

function pick(ev){
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left)/r.width)*2 - 1, -((ev.clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(scene.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o) { if (o.userData.hit) return o.userData.hit; o = o.parent; }
  }
  return null;
}
renderer.domElement.addEventListener('pointermove', ev => {
  pointerInside = true;
  ptrClient.x = ev.clientX; ptrClient.y = ev.clientY;
  const r = renderer.domElement.getBoundingClientRect();
  look.set(((ev.clientX - r.left)/r.width)*2 - 1, -((ev.clientY - r.top)/r.height)*2 + 1);
});
renderer.domElement.addEventListener('pointerleave', () => { pointerInside = false; hovered = null; look.set(0,0); renderer.domElement.style.cursor = 'default'; });
/* drag (or swipe) sideways to move across the room */
let dragFrom = null, dragPan = 0, dragged = 0;
const worldPerPx = () => (2 * camDist * Math.tan(T.MathUtils.degToRad(camera.fov)/2) * camera.aspect)
                         / renderer.domElement.getBoundingClientRect().width;
renderer.domElement.addEventListener('pointerdown', ev => {
  if (panMax - panMin < .5) return;
  dragFrom = ev.clientX; dragPan = panX; dragged = 0;
  renderer.domElement.setPointerCapture(ev.pointerId);
});
renderer.domElement.addEventListener('pointermove', ev => {
  if (dragFrom === null) return;
  const dx = ev.clientX - dragFrom;
  dragged = Math.max(dragged, Math.abs(dx));
  panX = Math.min(panMax, Math.max(panMin, dragPan - dx * worldPerPx()));
  if (dragged > 6) renderer.domElement.style.cursor = 'grabbing';
});
const endDrag = ev => {
  if (dragFrom === null) return;
  dragFrom = null;
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'default';
  try { renderer.domElement.releasePointerCapture(ev.pointerId); } catch(e){}
};
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

renderer.domElement.addEventListener('click', ev => {
  if (dragged > 6) { dragged = 0; return; }   /* that was a swipe, not a tap */
  const hit = pick(ev);
  if (hit) openReader(hit.id);
});

/* on touch there is no hover, so a tap shows the label before it opens */
renderer.domElement.addEventListener('pointerdown', ev => {
  if (ev.pointerType !== 'mouse') {
    ptrClient.x = ev.clientX; ptrClient.y = ev.clientY;
    pointerInside = true;
  }
});

/* label follows the object in 3D */
const pos = new T.Vector3();
function placeChip(){
  if (!hovered) { chip.setAttribute('data-on','false'); return; }
  pos.copy(hovered.anchor).project(camera);
  const r = renderer.domElement.getBoundingClientRect();
  chip.style.left = (r.left + (pos.x*.5+.5)*r.width) + 'px';
  chip.style.top  = (r.top + (-pos.y*.5+.5)*r.height) + 'px';
  chip.textContent = hovered.label;
  chip.setAttribute('data-on','true');
}

/* dev hook: only on #dev, used to verify hit-testing after changes */
if (location.hash === '#dev') window.__dev = {
  TARGETS, camera, renderer,
  pickAt(x,y){ const h = pick({clientX:x, clientY:y}); return h ? h.id : null; },
  project(v){ const q = v.clone().project(camera); const r = renderer.domElement.getBoundingClientRect();
    return {x: r.left + (q.x*.5+.5)*r.width, y: r.top + (-q.y*.5+.5)*r.height}; }
};

/* ---------- loop: parallax + hints pulse ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0 = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min((now - t0)/1000, .05); t0 = now;

  if (!reduce) {
    lookNow.x += (look.x - lookNow.x) * Math.min(1, dt*2.6);
    lookNow.y += (look.y - lookNow.y) * Math.min(1, dt*2.6);
    /* kept small on purpose: a bigger sway slides the room out from under the
       cursor, so the thing you are pointing at would change while you aim. */
    const sway = portrait ? 0 : .34;
    camera.position.x = FOCUS.x + panX + lookNow.x * sway;
    camera.position.y = aimY + camDist*0.10 - lookNow.y * (portrait ? 0 : .2);
    camera.lookAt(FOCUS.x + panX, aimY, FOCUS.z);
  }

  if (hintsOn) {
    const p = (Math.sin(now/280)*.5+.5);
    TARGETS.forEach(t => t.g.traverse(o => {
      if (o.isMesh) { o.material.emissive = o.material.emissive || new T.Color(); o.material.emissive.setRGB(p*.22, p*.17, p*.04); }
    }));
  }

  if (pointerInside) {
    const hit = pick({clientX: ptrClient.x, clientY: ptrClient.y});
    if (hit !== hovered) {
      hovered = hit;
      renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
    }
  }
  placeChip();
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
document.getElementById('loading').remove();
if (matchMedia('(hover: none)').matches)
  document.getElementById('lede').textContent =
    'Swipe to look around, tap anything that catches your eye — or use the menu.';

/* ---------- reader, menu, hints, counter ---------- */
const reader = document.getElementById('reader');
const body = document.getElementById('reader-body');
const panel = document.getElementById('panel');
const menubtn = document.getElementById('menubtn');
const hintbtn = document.getElementById('hints');
const actions = document.getElementById('actions');
const counter = document.getElementById('counter');

let found = {};
try { found = JSON.parse(localStorage.getItem('gtFound') || '{}'); } catch(e){}
const tick = () => counter.textContent = Object.keys(found).length + ' of ' + TARGETS.length + ' discovered';
tick();

let lastFocus = null;
function openReader(id){
  if (!CONTENT[id]) return;
  lastFocus = document.activeElement;
  body.innerHTML = CONTENT[id];
  reader.setAttribute('data-open','true');
  document.body.style.overflow = 'hidden';
  actions.setAttribute('data-hidden','true');
  chip.setAttribute('data-on','false');
  if (!found[id]) { found[id] = 1; try { localStorage.setItem('gtFound', JSON.stringify(found)); } catch(e){} tick(); }
}
function closeReader(){
  reader.setAttribute('data-open','false');
  document.body.style.overflow = '';
  actions.setAttribute('data-hidden','false');
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
const setPanel = o => {
  panel.setAttribute('data-open', o?'true':'false');
  menubtn.setAttribute('aria-expanded', o?'true':'false');
  document.body.setAttribute('data-panel', o?'open':'closed');
};

document.addEventListener('click', e => {
  const t = e.target.closest('.item[data-open]');
  if (t) { setPanel(false); openReader(t.getAttribute('data-open')); return; }
  if (e.target.closest('[data-close-reader]')) closeReader();
  if (e.target.closest('[data-close-panel]')) setPanel(false);
});
menubtn.addEventListener('click', () => setPanel(panel.getAttribute('data-open') !== 'true'));
hintbtn.addEventListener('click', () => {
  hintsOn = !hintsOn;
  hintbtn.setAttribute('aria-pressed', hintsOn ? 'true' : 'false');
  if (!hintsOn) TARGETS.forEach(t => t.g.traverse(o => { if (o.isMesh && o.material.emissive) o.material.emissive.setRGB(0,0,0); }));
});
addEventListener('keydown', e => {
  if (e.key === 'Escape') { reader.getAttribute('data-open') === 'true' ? closeReader() : setPanel(false); }
});
addEventListener('pointerdown', e => {
  if (panel.getAttribute('data-open') === 'true' && !panel.contains(e.target) && e.target !== menubtn) setPanel(false);
});
</script>
