<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giovanni Tognetto — Partnerships, Marketing &amp; Data</title>
<meta name="description" content="Welcome to my office. Click the things on my desk and shelf to explore my work, what I can do for you, and a little about me.">
<meta property="og:type" content="website">
<meta property="og:title" content="Giovanni Tognetto — Partnerships, Marketing &amp; Data">
<meta property="og:description" content="Freelance partner manager and marketer for events, entertainment and fast-growing brands. Based in Madrid, working across Europe.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#2e2620;--ink:#2e211c;--ink-rgb:46 33 28;--scrim-rgb:30 29 27;
  --paper:#f7f0e2;--light:#f5e9d9;--light-rgb:245 233 217;
  --accent:#f0c64a;--brand:#b2364f;
  --font-display:'Playfair Display',Georgia,serif;--font-ui:'Karla',system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--stage)}
body{font-family:var(--font-ui);color:var(--light);overflow:hidden}
a{color:var(--accent);text-decoration:none}

.page{position:relative;width:100%;height:100dvh;min-height:560px;overflow:hidden}
.stage{position:absolute;inset:0;container-type:size}
.scene{position:absolute;inset:0;overflow:hidden}
.frame{position:absolute;top:50%;left:50%;translate:-50% -50%;
  width:max(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9}
.frame canvas{width:100%;height:100%;display:block}
.loading{position:absolute;inset:0;display:grid;place-items:center;
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgb(var(--light-rgb)/.5)}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 48% 42% at 14% 90%,rgb(var(--scrim-rgb)/.6) 0%,rgb(var(--scrim-rgb)/.28) 55%,transparent 100%),
  linear-gradient(0deg,rgb(var(--scrim-rgb)/.8) 0%,rgb(var(--scrim-rgb)/.38) 26%,transparent 46%)}

.actions{position:absolute;top:4%;right:4%;display:flex;gap:8px;z-index:6;transition:opacity .25s}
.actions[data-hidden=true]{opacity:0;visibility:hidden}
.pill{min-height:44px;padding:0 16px;border-radius:999px;cursor:pointer;
  border:1px solid rgb(var(--light-rgb)/.28);background:rgb(var(--scrim-rgb)/.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:var(--light);font-family:var(--font-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.pill:hover{border-color:rgb(var(--light-rgb)/.5)}
.pill:active{transform:scale(.96)}
.pill[aria-pressed=true],.pill[aria-expanded=true]{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}

.intro{position:absolute;left:4%;bottom:6%;width:38%;min-width:260px;pointer-events:none;z-index:5}
.title{margin:0;font-family:var(--font-display);font-weight:400;
  font-size:clamp(34px,4.6vw,76px);line-height:1.02;letter-spacing:-.015em}
.lede{margin:14px 0 0;max-width:30ch;font-size:clamp(14px,1.15vw,18px);line-height:1.5;color:rgb(var(--light-rgb)/.82)}
.counter{margin-top:22px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgb(var(--light-rgb)/.6)}

.hot{position:absolute;transform:translate(-50%,-50%);width:var(--w,10%);height:var(--h,14%);
  padding:0;border:0;background:none;border-radius:14px;cursor:pointer;z-index:4}
.hot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ring{position:absolute;inset:0;border-radius:14px;border:2px solid transparent;
  transition:border-color .2s,background .2s,box-shadow .2s}
.hot:hover .ring,.hot:focus-visible .ring{border-color:rgba(255,230,170,.55);
  background:rgba(255,230,170,.14);box-shadow:0 0 0 2px rgba(255,230,170,.3)}
.chip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,6px);
  padding:4px 12px;border:1.5px solid var(--ink);border-radius:999px;background:var(--accent);color:var(--ink);
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  opacity:0;transition:opacity .16s,transform .16s;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.hot:hover .chip,.hot:focus-visible .chip{opacity:1;transform:translate(-50%,0)}
.hot[data-hint=true] .ring{animation:hint 1.6s ease-in-out infinite;
  box-shadow:0 0 0 2px rgba(255,230,170,.6),0 0 18px rgba(255,214,120,.45)}
@keyframes hint{50%{box-shadow:0 0 0 2px rgba(255,230,170,.2),0 0 8px rgba(255,214,120,.18)}}

.hot[data-open=work]{left:34%;top:60%;--w:15%;--h:22%}
.hot[data-open=services]{left:47%;top:71%;--w:10%;--h:12%}
.hot[data-open=contact]{left:80.5%;top:70%;--w:11%;--h:13%}
.hot[data-open=about]{left:67%;top:57%;--w:8%;--h:14%}
.hot[data-open=resume]{left:66%;top:25%;--w:11%;--h:16%}
.hot[data-open=languages]{left:81%;top:41%;--w:8%;--h:13%}
.hot[data-open=beyond]{left:17%;top:26%;--w:14%;--h:24%}

.panel{position:fixed;top:0;right:0;z-index:9100;display:flex;flex-direction:column;
  width:min(320px,86vw);height:100dvh;padding:16px 14px;overflow-y:auto;
  background:rgb(var(--scrim-rgb)/.86);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);
  box-shadow:-24px 0 60px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .32s cubic-bezier(.3,0,.1,1)}
.panel[data-open=true]{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:10px}
.panel-title{font-family:var(--font-display);font-size:18px}
.panel-close{width:44px;height:44px;border-radius:999px;border:1px solid rgb(var(--light-rgb)/.28);
  background:none;color:var(--light);font-size:18px;cursor:pointer}
.item{display:block;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:10px;
  background:none;color:var(--light);font-family:var(--font-ui);font-size:15px;text-align:left;cursor:pointer}
.item:hover{background:rgb(var(--light-rgb)/.1)}
.group{display:flex;flex-direction:column;gap:1px;margin:4px 0;padding-top:6px;border-top:1px solid rgb(var(--light-rgb)/.14)}
.group-label{padding:4px 12px 2px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--light-rgb)/.55)}
.sub{padding-left:22px;color:rgb(var(--light-rgb)/.85)}

.reader{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;padding:24px}
.reader[data-open=true]{display:flex}
.reader-scrim{position:absolute;inset:0;background:rgba(24,18,15,.7);backdrop-filter:blur(2px)}
.sheet{position:relative;width:min(880px,100%);max-height:84vh;overflow:auto;padding:clamp(26px,4.4vw,52px);
  border-radius:10px;background:var(--paper);color:var(--ink);box-shadow:0 36px 70px rgba(0,0,0,.5)}
.closeX{position:absolute;top:-54px;right:0;width:46px;height:46px;border-radius:999px;border:0;
  background:var(--accent);color:var(--ink);font-size:18px;cursor:pointer}
.r-name{margin:0 0 4px;font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.2vw,46px);line-height:1.05}
.r-role{margin:0 0 20px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brand)}
.r-rule{height:2px;background:var(--ink);margin-bottom:22px}
.r-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:34px}
.r-lab{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--brand)}
.r-h{margin:0 0 2px;font-family:var(--font-display);font-weight:400;font-size:22px}
.r-meta{margin:0 0 8px;font-family:var(--font-mono);font-size:12px;color:rgb(var(--ink-rgb)/.65)}
.r-p{margin:0 0 16px;font-size:15px;line-height:1.55}
.r-block{margin-bottom:20px}
.r-ul{margin:0 0 16px;padding-left:18px;font-size:14.5px;line-height:1.7}
.sheet a{color:var(--brand);text-decoration:underline}
.cta{display:inline-block;margin-top:6px;padding:13px 22px;border-radius:999px;background:var(--ink);
  color:var(--paper)!important;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none!important}
.cta:hover{background:var(--brand)}

.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

@media (max-width:899px){
  .intro{width:auto;right:4%;bottom:5%}
  .title{font-size:30px}
  .lede{font-size:14.5px;max-width:none}
  .hot{--w:16%!important;--h:13%!important}
  .r-grid{grid-template-columns:1fr;gap:18px}
  .closeX{top:8px;right:8px;background:rgba(46,33,28,.8);color:var(--paper)}
}
@media (prefers-reduced-motion:reduce){
  .hot[data-hint=true] .ring{animation:none}
  .panel{transition:none}
}
</style>
</head>

<script type="module">
import * as T from 'three';

const frame = document.getElementById('frame');
const loading = document.getElementById('loading');

const scene = new T.Scene();
scene.background = new T.Color('#2e2620');
const camera = new T.PerspectiveCamera(30, 16/9, .1, 200);
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(1600, 900, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
frame.appendChild(renderer.domElement);

const mat = (c, r = .78, m = 0) => new T.MeshStandardMaterial({color:new T.Color(c), roughness:r, metalness:m});
function box(w,h,d,c,x,y,z,material){
  const o = new T.Mesh(new T.BoxGeometry(w,h,d), material || mat(c));
  o.position.set(x,y,z); o.castShadow = true; o.receiveShadow = true; scene.add(o); return o;
}
function cyl(rt,rb,h,c,x,y,z,seg=24){
  const o = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg), mat(c));
  o.position.set(x,y,z); o.castShadow = true; o.receiveShadow = true; scene.add(o); return o;
}
function sph(r,c,x,y,z){
  const o = new T.Mesh(new T.SphereGeometry(r,32,24), mat(c,.6));
  o.position.set(x,y,z); o.castShadow = true; o.receiveShadow = true; scene.add(o); return o;
}

/* room */
box(60,26,1,'#413a30',0,9,-4).castShadow = false;
box(60,1,16,'#241f19',0,-4.5,4).castShadow = false;

/* light */
scene.add(new T.HemisphereLight(0xffe9c9, 0x2a221a, .55));
const key = new T.DirectionalLight(0xffe2b0, 2.1);
key.position.set(-9,13,10); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.bias = -.0012; key.shadow.radius = 4;
Object.assign(key.shadow.camera,{left:-22,right:22,top:18,bottom:-14,near:1,far:50});
scene.add(key);
const fill = new T.DirectionalLight(0xd8b98a, .45);
fill.position.set(10,5,9); scene.add(fill);
const glow = new T.PointLight(0xffd9a0, 22, 26, 2);
glow.position.set(-7.5,8.5,1.5); scene.add(glow);

/* desk */
const deskY = -1.2, dx = -7.2;
box(13,.5,5.4,'#6f4a2c',dx,deskY,1.6);
box(12,.5,.6,'#5a3b22',dx,deskY-.55,-.7);
box(.6,6,.6,'#5a3b22',dx-6,deskY-3.2,3.6);
box(.6,6,.6,'#5a3b22',dx+6,deskY-3.2,3.6);
box(.6,6,.6,'#54371f',dx-6,deskY-3.2,-.4);
box(.6,6,.6,'#54371f',dx+6,deskY-3.2,-.4);
box(11.4,.35,3.6,'#5a3b22',dx,deskY-3.1,1.6);

/* laptop */
box(5.4,.3,3.6,'#b9b2a6',dx-.4,deskY+.4,2.2);
const lid = new T.Group();
const lidBack = new T.Mesh(new T.BoxGeometry(5.4,3.3,.25), mat('#2b2721'));
lidBack.position.y = 1.65; lidBack.castShadow = true; lid.add(lidBack);
const screen = new T.Mesh(new T.BoxGeometry(4.9,2.85,.06), mat('#0c0a07',.5));
screen.position.set(0,1.65,.16); lid.add(screen);
[['#b23a2f',.5,-1.6],['#d9b24c',.95,-.75],['#5e9e79',1.45,.1],['#7c6bd8',2,.95]].forEach(([c,h,x])=>{
  const b = new T.Mesh(new T.BoxGeometry(.52,h,.04), mat(c,.5));
  b.position.set(x,.55+h/2,.2); lid.add(b);
});
lid.position.set(dx-.4, deskY+.5, .45); lid.rotation.x = -.16; scene.add(lid);

/* notebook + mug */
const nb = box(2.6,.22,1.9,'#f0c64a',dx+3.9,deskY+.36,2.5); nb.rotation.y = -.22;
for (let i=0;i<3;i++){ const l = box(1.8,.03,.1,'#241f19',dx+3.95,deskY+.48,2.1+i*.45); l.rotation.y = -.22; }
cyl(.42,.42,.85,'#f6f1e6',dx-4.6,deskY+.68,2.6);

/* bookcase */
const hx = 7.6, bw = 11, bd = 3.4;
box(bw,.5,bd,'#d9a823',hx,-4,2);
[-0.5,3,6.5,9.6].forEach(y => box(bw,.5,bd,'#f0c64a',hx,y,2));
box(.5,13,bd,'#e0b32f',hx-5.3,2.8,2);
box(.5,13,bd,'#e0b32f',hx+5.3,2.8,2);
box(.5,13,bd,'#e7ba33',hx,2.8,2);
box(bw,13,.3,'#a8831b',hx,2.8,.5).castShadow = false;

function books(bx,by,bz,n,s){
  const cl = ['#8e3b32','#3e5e7e','#d9b24c','#5e7a4f','#a6512e','#6b5aa6','#c9c0ad'];
  for (let j=0;j<n;j++){
    const h = 1.5+(j%3)*.35, w = .22+(j%4)*.07;
    box(w,h,1.5,cl[(j+s)%7],bx+j*.42,by+h/2,bz);
  }
}
books(hx-4.9,9.85,2.2,9,0); books(hx+.5,9.85,2.2,5,3);
books(hx-4.9,6.75,2.2,6,2); books(hx-4.9,3.25,2.2,4,5);

/* basketball */
const ball = sph(1.05,'#d1762b',hx-3.2,.6,2.2);
const seamGeo = new T.TorusGeometry(1.05,.045,8,40);
const seam = new T.Mesh(seamGeo, mat('#241f19')); seam.position.copy(ball.position); scene.add(seam);
const seam2 = new T.Mesh(seamGeo, mat('#241f19')); seam2.position.copy(ball.position); seam2.rotation.y = Math.PI/2; scene.add(seam2);

/* globe */
sph(.95,'#2e6e8e',hx+2.6,4.25,2.2);
cyl(.5,.6,.28,'#241f19',hx+2.6,3.4,2.2);

/* rotary phone */
const phone = new T.Group();
const body = new T.Mesh(new T.BoxGeometry(2.3,.75,1.5), mat('#e58fa0',.55));
body.castShadow = body.receiveShadow = true; phone.add(body);
const dial = new T.Mesh(new T.CylinderGeometry(.62,.62,.12,28), mat('#f3b7c2',.5));
dial.rotation.x = Math.PI/2; dial.position.set(0,.15,.78); dial.castShadow = true; phone.add(dial);
const handset = new T.Mesh(new T.CapsuleGeometry(.26,1.7,6,12), mat('#f0a4b3',.5));
handset.rotation.z = Math.PI/2; handset.position.set(0,.62,-.1); handset.castShadow = true; phone.add(handset);
phone.position.set(hx+2.6,.05,2.1); phone.rotation.y = -.2; scene.add(phone);

/* wall shelf, plant, frames */
const shY = 7.4, sx = -8.4;
box(7.4,.4,1.6,'#f0c64a',sx,shY,-2.4);
cyl(.78,.6,.9,'#1f1a12',sx-2.1,shY+.65,-2.3);
const vines = new T.Group();
for (let i=0;i<5;i++){
  const a = (i/5)*Math.PI*2, L = 1.6+(i%3)*.9;
  const v = new T.Mesh(new T.CylinderGeometry(.045,.045,L,6), mat('#5e9c47'));
  v.position.set(Math.cos(a)*.5,-L/2,Math.sin(a)*.35); v.rotation.z = Math.cos(a)*.25; v.castShadow = true; vines.add(v);
  const leaf = new T.Mesh(new T.SphereGeometry(.2,10,8), mat('#7cc05a'));
  leaf.scale.set(1,.45,1); leaf.position.set(Math.cos(a)*.62,-L,Math.sin(a)*.4); leaf.castShadow = true; vines.add(leaf);
}
vines.position.set(sx-2.1, shY+.2, -2.3); scene.add(vines);
function picture(x,y,w,h,c){ box(w,h,.18,'#efe7d6',x,y,-2.1); box(w-.5,h-.5,.06,c,x,y,-1.98); }
picture(sx+.9, shY+1.4, 1.9, 2.1, '#8c7b64');
picture(sx+3, shY+1.3, 1.7, 1.8, '#5c6b7a');

camera.position.set(0,4.6,27);
camera.lookAt(0,2.2,0);
renderer.render(scene,camera);
loading.remove();
</script>

  var CAL = 'https://calendar.app.google/UVRpSX8X4jy7VhyV8',

  var C = {

  var found = {};
  try { found = JSON.parse(localStorage.getItem('gtFound') || '{}'); } catch(e){}
  function tick(){
    var n = Object.keys(found).length;
    counter.textContent = n + ' of ' + hots.length + ' discovered';
  }
  tick();

  var lastFocus = null;
  function open(key){
    if (!C[key]) return;
    lastFocus = document.activeElement;
    body.innerHTML = C[key];
    reader.setAttribute('data-open','true');
    document.body.style.overflow = 'hidden';
    actions.setAttribute('data-hidden','true');
    if (!found[key]) {
      found[key] = 1;
      try { localStorage.setItem('gtFound', JSON.stringify(found)); } catch(e){}
      tick();
    }
  }
  function close(){
    reader.setAttribute('data-open','false');
    document.body.style.overflow = '';
    actions.setAttribute('data-hidden','false');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function setPanel(o){
    panel.setAttribute('data-open', o ? 'true' : 'false');
    menubtn.setAttribute('aria-expanded', o ? 'true' : 'false');
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-open]');
    if (t && t.classList.contains('hot') || (t && t.classList.contains('item'))) {
      setPanel(false); open(t.getAttribute('data-open')); return;
    }
    if (e.target.closest('[data-close-reader]')) close();
    if (e.target.closest('[data-close-panel]')) setPanel(false);
  });

  menubtn.addEventListener('click', function(){
    setPanel(panel.getAttribute('data-open') !== 'true');
  });

  hintbtn.addEventListener('click', function(){
    var on = hintbtn.getAttribute('aria-pressed') !== 'true';
    hintbtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    hots.forEach(function(b){ b.setAttribute('data-hint', on ? 'true' : 'false'); });
  });

  addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      if (reader.getAttribute('data-open') === 'true') close();
      else setPanel(false);
    }
  });

  addEventListener('pointerdown', function(e){
    if (panel.getAttribute('data-open') === 'true' && !panel.contains(e.target) && e.target !== menubtn) setPanel(false);
  });
});
